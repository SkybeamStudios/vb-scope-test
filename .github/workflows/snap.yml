name: "Vibastic ${{ inputs.client_build_id }}"
on:
  workflow_dispatch:
    inputs:
      client_build_id: { required: true, type: string }
      retry_count: { required: false, type: string, default: "0" }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Electron app for snapcraft
        run: |
          mkdir -p snap/gui app
          cp -r electron/app/* app/
          cat > snap/snapcraft.yaml <<'YAML'
          name: vibastic-app
          base: core22
          version: "1.0.0"
          summary: Vibastic app
          description: App generated with Vibastic
          confinement: strict
          grade: stable
          apps:
            vibastic-app:
              command: electron-launch
              plugs: [browser-support, network]
          parts:
            app:
              plugin: dump
              source: electron/dist/linux-unpacked
          YAML
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with: { name: snap, retention-days: 7, path: "${{ steps.snap.outputs.snap }}" }
