name: "Vibastic ${{ github.event.inputs.client_build_id }}"
on:
  workflow_dispatch:
    inputs:
      client_build_id: { required: true, type: string }
      retry_count: { required: false, type: string, default: "0" }
      variant: { required: false, type: string, default: "apk" }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android
        run: |
          gradle assembleDebug bundleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx3g
      - name: Retry on transient failure (max 3)
        if: failure() && github.event.inputs.retry_count != '3'
        run: echo "retry ${{ github.event.inputs.retry_count }} — relancé par l'API"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-aab
          retention-days: 7
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
